name: Flutter Analyze

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Analyze code and requirements
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Verify Flutter installation
      run: flutter doctor

    - name: Check pub dependencies
      run: |
        flutter pub get
        if [ -f "example/lib/realtime_audio/custom_dsp/pubspec.yaml" ]; then
          (cd example/lib/realtime_audio/custom_dsp && flutter pub get)
        fi

    - name: "Run Dart Analyze"
      # Infos and warnings fail the job, as errors do.
      run: dart analyze --fatal-infos lib/

    - name: Check Code formatting
      run: dart format -o none --set-exit-if-changed .

    - name: Check pub.dev requirements
      run: flutter pub publish --dry-run
      
    - name: Block merge if checks fail
      if: ${{ failure() }}
      run: echo "Checks failed, cannot merge." && exit 1
